name: Build Rol Senin 1.2.1 Clean AAB

on:
  push:
    branches:
      - rol-senin-live
    paths:
      - '.github/workflows/build-rs121-clean-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-clean
          mkdir -p android-clean/app/src/main/java/com/ametrix/rolsenin
          mkdir -p android-clean/app/src/main/assets
          mkdir -p android-clean/app/src/main/res/drawable
          mkdir -p android-clean/app/src/main/res/values

          cat > android-clean/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RolSenin'
          include ':app'
          EOF

          cat > android-clean/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > android-clean/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > android-clean/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ametrix.rolsenin'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.ametrix.rolsenin'
                  minSdk 26
                  targetSdk 36
                  versionCode 4
                  versionName '1.2.1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android-clean/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Rol Senin"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-clean/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#111827</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android-clean/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M24,29h60a7,7 0,0 1,7,7v38a7,7 0,0 1,-7,7h-60a7,7 0,0 1,-7,-7v-38a7,7 0,0 1,7,-7z"/>
              <path android:fillColor="#111827" android:pathData="M44,41l28,14l-28,14z"/>
          </vector>
          EOF

          cat > android-clean/app/src/main/java/com/ametrix/rolsenin/MainActivity.java <<'EOF'
          package com.ametrix.rolsenin;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private WebView browser;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  browser = new WebView(this);
                  browser.setBackgroundColor(Color.rgb(17, 24, 39));
                  browser.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  WebSettings settings = browser.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  browser.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (!url.startsWith("https://appassets.androidplatform.net/assets/")) return null;
                          String asset = url.substring("https://appassets.androidplatform.net/assets/".length());
                          if (!asset.equals("game.html")) return null;
                          try {
                              InputStream input = getAssets().open(asset);
                              return new WebResourceResponse("text/html", "UTF-8", input);
                          } catch (IOException error) {
                              return null;
                          }
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 30) {
                      browser.setOnApplyWindowInsetsListener((view, insets) -> {
                          android.graphics.Insets bars = insets.getInsets(WindowInsets.Type.systemBars());
                          view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return insets;
                      });
                  } else {
                      browser.setFitsSystemWindows(true);
                  }

                  setContentView(browser);
                  browser.loadUrl("https://appassets.androidplatform.net/assets/game.html");
              }

              @Override
              public void onBackPressed() {
                  if (browser.canGoBack()) browser.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/ametrix13/ben10-oyunu/rol-senin-live/play/index.html" \
            -o android-clean/app/src/main/assets/game.html

          grep -q "rs121PlayScript" android-clean/app/src/main/assets/game.html
          grep -q "KAPALI BETA" android-clean/app/src/main/assets/game.html

      - name: Build unsigned release bundle
        working-directory: android-clean
        run: gradle --no-daemon :app:bundleRelease

      - name: Inspect unsigned bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB=android-clean/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          echo "AAB_SIZE=$(stat -c%s "$AAB")" >> "$GITHUB_ENV"

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: RolSenin-1.2.1-unsigned
          path: android-clean/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
