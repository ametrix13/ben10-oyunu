name: Build Rol Senin Android Play

on:
  push:
    branches: [rol-senin-android-play]
    paths:
      - 'android-play/**'
      - '.github/workflows/build-rol-senin-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Embed current Rol Senin game
        run: |
          mkdir -p android-play/app/src/main/assets
          cp r112-full.html android-play/app/src/main/assets/index.html
          test -s android-play/app/src/main/assets/index.html
          grep -q '1.1.7' android-play/app/src/main/assets/index.html
          grep -q 'Rol Social' android-play/app/src/main/assets/index.html
          grep -q 'Kariyer Dünyası' android-play/app/src/main/assets/index.html

      - name: Build AAB and debug APK
        working-directory: android-play
        run: |
          gradle --no-daemon bundleRelease assembleDebug

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android-play/app/build/outputs/bundle/release/app-release.aab dist/Rol-Senin-1.1.7-unsigned.aab
          cp android-play/app/build/outputs/apk/debug/app-debug.apk dist/Rol-Senin-1.1.7-debug.apk

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: rol-senin-google-play-build
          path: dist/*
          if-no-files-found: error
          retention-days: 7
