<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Rol Senin 1.1.2</title><style>html,body{margin:0;background:#f4f1ea;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}#boot{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#111;color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em}.title{font-size:38px;font-weight:900;letter-spacing:-.055em;margin:16px 0 5px}.sub{color:#777;font-size:14px}.bar{width:min(220px,65vw);height:5px;background:#dedbd3;border-radius:999px;margin:22px auto;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#111;border-radius:inherit;animation:a 1s ease-in-out infinite alternate}@keyframes a{to{transform:translateX(185%)}}</style></head><body><div id="boot"><div><div class="badge">1.1.2 · LOUNGE</div><div class="title">Rol Senin</div><div class="sub">Oyun açılıyor…</div><div class="bar"><i></i></div></div></div><script>(async()=>{try{const n=7,rs=await Promise.all(Array.from({length:n},(_,i)=>fetch('./r112data/p'+i+'.txt?v=1123',{cache:'no-store'})));for(const r of rs)if(!r.ok)throw new Error('Dosya '+r.status);const b64=(await Promise.all(rs.map(r=>r.text()))).join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('ROL SENİN')&&!html.includes('Rol Senin'))throw new Error('Oyun verisi hatalı');document.open();document.write(html);document.close()}catch(e){document.querySelector('#boot').innerHTML='<div><div class="badge">HATA</div><div class="title">Oyun açılamadı</div><div class="sub">'+String(e.message||e)+'</div></div>';console.error(e)}})();</script></body></html>
