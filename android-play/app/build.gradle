plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ametrix.rolsenin'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.ametrix.rolsenin'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
